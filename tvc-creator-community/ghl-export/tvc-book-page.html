<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800;900&display=swap');

  #tvcb-root {
    --tvc-bg: #060107;
    --tvc-bg-soft: #0d0410;
    --tvc-card: #140a18;
    --tvc-purple: #7c2af8;
    --tvc-pink: #ec1fa0;
    --tvc-gradient: linear-gradient(135deg, #5b21b6 0%, #a021c9 45%, #ec1fa0 100%);
    background: var(--tvc-bg);
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  #tvcb-root * { box-sizing: border-box; }
  #tvcb-root img { max-width: 100%; display: block; }
  #tvcb-root a { color: inherit; text-decoration: none; }

  #tvcb-root .tvcb-display { font-family: 'Anton', 'Inter', sans-serif; letter-spacing: .01em; }
  #tvcb-root .tvcb-gradient-bg { background-image: var(--tvc-gradient); }
  #tvcb-root .tvcb-gradient-border {
    border: 1px solid transparent;
    background-image: linear-gradient(var(--tvc-bg), var(--tvc-bg)), var(--tvc-gradient);
    background-origin: border-box;
    background-clip: padding-box, border-box;
  }

  @keyframes tvcb-nav-shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes tvcb-spin { to { transform: rotate(360deg); } }

  .tvcb-nav-shimmer {
    height: 2px; width: 100%; opacity: .7;
    background-image: linear-gradient(90deg, transparent 0%, var(--tvc-purple) 25%, var(--tvc-pink) 50%, var(--tvc-purple) 75%, transparent 100%);
    background-size: 200% 100%;
    animation: tvcb-nav-shimmer 6s linear infinite;
  }

  /* NAV */
  .tvcb-nav { position: sticky; top: 0; z-index: 50; width: 100%; border-bottom: 1px solid rgba(255,255,255,.1); background: rgba(0,0,0,.7); backdrop-filter: blur(10px); }
  .tvcb-nav__inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; gap: 12px; }
  .tvcb-nav__logo { width: 32px; height: 32px; border-radius: 999px; object-fit: cover; }
  .tvcb-nav__step { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: rgba(255,255,255,.4); text-align: right; }
  @media (min-width: 640px) { .tvcb-nav__inner { padding: 16px 24px; } .tvcb-nav__logo { width: 36px; height: 36px; } .tvcb-nav__step { font-size: 12px; } }

  /* HERO */
  .tvcb-hero { position: relative; overflow: hidden; padding: 56px 16px; text-align: center; }
  .tvcb-hero__glow {
    position: absolute; inset: 0; z-index: 0; opacity: .6; pointer-events: none;
    background: radial-gradient(60% 50% at 50% 0%, rgba(124,42,248,.35) 0%, rgba(6,1,7,0) 70%),
                radial-gradient(40% 40% at 85% 20%, rgba(236,31,160,.25) 0%, rgba(6,1,7,0) 70%);
  }
  .tvcb-hero__inner { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }
  .tvcb-eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #e879f9; }
  .tvcb-hero h1 { font-size: 30px; text-transform: uppercase; line-height: 1.2; color: #fff; margin: 0; }
  .tvcb-hero__sub { max-width: 560px; margin: 16px auto 0; font-size: 14px; color: rgba(255,255,255,.7); }
  @media (min-width: 640px) {
    .tvcb-hero { padding: 80px 24px; }
    .tvcb-hero h1 { font-size: 36px; }
    .tvcb-hero__sub { font-size: 18px; }
  }
  @media (min-width: 768px) { .tvcb-hero h1 { font-size: 48px; } }

  /* BOOKING SLOT */
  .tvcb-cal-card {
    position: relative; margin: 40px auto 0; overflow: hidden;
    border-radius: 16px; background: var(--tvc-card);
    min-height: 420px;
  }
  @media (min-width: 640px) { .tvcb-cal-card { min-height: 560px; } }
  .tvcb-cal-card iframe { width: 100%; border: none; display: block; min-height: inherit; }

  .tvcb-cal-loader {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;
    background: var(--tvc-card);
  }
  .tvcb-cal-loader__icon {
    width: 56px; height: 56px; border-radius: 999px; display: flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 15px 30px -8px rgba(124,42,248,.45);
  }
  .tvcb-cal-loader__icon svg { width: 28px; height: 28px; }
  .tvcb-cal-loader__text { font-family: 'Anton','Inter',sans-serif; font-size: 18px; text-transform: uppercase; color: #fff; margin: 0; }
  .tvcb-cal-loader__spinner {
    width: 22px; height: 22px; border-radius: 999px;
    border: 2px solid rgba(255,255,255,.15); border-top-color: var(--tvc-pink);
    animation: tvcb-spin .8s linear infinite;
  }

  /* FOOTER */
  .tvcb-footer { border-top: 1px solid rgba(255,255,255,.1); background: #000; padding: 32px 16px; text-align: center; }
  .tvcb-footer__brand { font-family: 'Anton','Inter',sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: rgba(255,255,255,.6); margin: 0; }
  .tvcb-footer__copy { margin: 8px 0 0; font-size: 11px; color: rgba(255,255,255,.3); }

  #tvcb-root [hidden] { display: none !important; }
</style>

<div id="tvcb-root">

  <!-- SECTION: NAV -->
  <header class="tvcb-nav">
    <div class="tvcb-nav__inner">
      <a href="/" aria-label="The Viral Circle">
        <img class="tvcb-nav__logo" src="https://assets-2-prod.whop.com/public/uploads/2025-05-14/user_3134765_25927faf-e31d-42f4-87d5-4a0552277e08.jpeg" alt="The Viral Circle" />
      </a>
      <span class="tvcb-nav__step">Step 2 of 3 &mdash; Book Your Call</span>
    </div>
    <div class="tvcb-nav-shimmer"></div>
  </header>

  <!-- SECTION: BOOKING -->
  <section class="tvcb-hero">
    <div class="tvcb-hero__glow"></div>
    <div class="tvcb-hero__inner">
      <p class="tvcb-eyebrow" id="tvcbEyebrow">You're In.</p>
      <h1 class="tvcb-display">Pick A Time That Works For You.</h1>
      <p class="tvcb-hero__sub">30 minutes. We'll look at your shop, your samples, and your current creators, and map out exactly what this looks like for your brand.</p>

      <div class="tvcb-gradient-border tvcb-cal-card" id="tvcbCalCard">
        <div class="tvcb-cal-loader" id="tvcbCalLoader" hidden>
          <div class="tvcb-cal-loader__icon tvcb-gradient-bg">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 16H5V8h14Z"/></svg>
          </div>
          <p class="tvcb-cal-loader__text">Loading Calendar...</p>
          <div class="tvcb-cal-loader__spinner"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- SECTION: FOOTER -->
  <footer class="tvcb-footer">
    <p class="tvcb-footer__brand">The Viral Circle</p>
    <p class="tvcb-footer__copy" id="tvcbFooterCopy">&copy; The Viral Circle. All rights reserved.</p>
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* ============ EDIT THIS ============
     Your GHL calendar's booking-widget URL.

     Find it in GHL: Calendars > (your calendar) > the three-dot menu >
     Embed / Share. Copy the URL out of the iframe src, it looks like:
       https://api.leadconnectorhq.com/widget/booking/AbC123xyz

     Leave it as an empty string and the slot just stays as an empty framed
     box (matching the Whop page as it is today), so you can drop a GHL
     Calendar element in on top of it instead. */
  var GHL_CALENDAR_URL = '';
  /* =================================== */

  var root = document.getElementById('tvcb-root');
  if (!root) return;

  /* footer year */
  var yearEl = document.getElementById('tvcbFooterCopy');
  if (yearEl) yearEl.textContent = '© ' + new Date().getFullYear() + ' The Viral Circle. All rights reserved.';

  /* ---------- who is this person? ----------
     URL params first (set your landing page's CTA or GHL redirect to pass
     ?name={{contact.name}}&email={{contact.email}}), then sessionStorage. */
  function readParam(keys) {
    try {
      var qs = new URLSearchParams(window.location.search);
      for (var i = 0; i < keys.length; i++) {
        var v = qs.get(keys[i]);
        if (v) return v.trim();
      }
    } catch (e) { /* no URLSearchParams support */ }
    return '';
  }
  function readStore(key) {
    try { return (sessionStorage.getItem(key) || '').trim(); } catch (e) { return ''; }
  }

  var leadName  = readParam(['name', 'first_name', 'full_name', 'firstName']) || readStore('tvc_lead_name');
  var leadEmail = readParam(['email', 'contact_email'])                       || readStore('tvc_lead_email');

  /* carry them to the thank-you page */
  try {
    if (leadName)  sessionStorage.setItem('tvc_lead_name', leadName);
    if (leadEmail) sessionStorage.setItem('tvc_lead_email', leadEmail);
  } catch (e) { /* non-fatal */ }

  /* personalise the eyebrow */
  var eyebrow = document.getElementById('tvcbEyebrow');
  if (eyebrow && leadName) {
    eyebrow.textContent = "You're In, " + leadName.split(' ')[0] + '.';
  }

  /* ---------- GHL calendar ---------- */
  var card = document.getElementById('tvcbCalCard');
  var loader = document.getElementById('tvcbCalLoader');

  if (!GHL_CALENDAR_URL || !card) return;

  if (loader) loader.hidden = false;

  /* prefill what we know so the booker doesn't retype it */
  var url = GHL_CALENDAR_URL;
  var params = [];
  if (leadName) {
    var parts = leadName.split(' ');
    params.push('first_name=' + encodeURIComponent(parts[0]));
    if (parts.length > 1) params.push('last_name=' + encodeURIComponent(parts.slice(1).join(' ')));
  }
  if (leadEmail) params.push('email=' + encodeURIComponent(leadEmail));
  if (params.length) url += (url.indexOf('?') === -1 ? '?' : '&') + params.join('&');

  var iframe = document.createElement('iframe');
  iframe.src = url;
  iframe.scrolling = 'no';
  iframe.setAttribute('title', 'Book your call');
  /* GHL's form_embed.js finds the frame by an id ending in _iframe and
     auto-sizes it to the booking widget's real height. */
  var slug = GHL_CALENDAR_URL.split('/').pop().split('?')[0];
  iframe.id = slug + '_iframe';
  iframe.style.width = '100%';
  iframe.style.border = 'none';
  iframe.style.minHeight = '560px';
  iframe.onload = function () { if (loader) loader.hidden = true; };
  card.appendChild(iframe);

  /* auto-resize script (loaded at runtime: GHL strips literal script tags) */
  if (!document.querySelector('script[data-tvcb-ghl-embed]')) {
    var s = document.createElement('script');
    s.src = 'https://link.msgsndr.com/js/form_embed.js';
    s.async = true;
    s.setAttribute('data-tvcb-ghl-embed', 'true');
    document.body.appendChild(s);
  }

  /* never leave the loader up forever */
  setTimeout(function () { if (loader) loader.hidden = true; }, 8000);
})();
</script>
